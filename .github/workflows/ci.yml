name: ci

# One repository, one root package plus one companion member. `neotales-ssh` is
# the package at the repository root; `e2e/` is `publish = false`. There is no
# working-directory indirection here.

on:
  push:
    # Every branch, not only the default one: a branch filter hides a failure
    # until the work lands. No path filter either, because a change to a README
    # can still be the change that breaks the build.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci

      - name: Format
        run: cargo fmt --all -- --check

      # `--workspace`, always: the default members of a virtual workspace are
      # every member, so the root package alone is no longer the unit under
      # test. `e2e/` is compiled here even though it is unpublished and its
      # container peer only runs where Docker exists.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      # The README and rustdoc samples are `no_run`. They must still compile,
      # which `--all-targets` does not do; only the doctest target does.
      - name: Doc tests
        run: cargo test --workspace --doc --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

      # The real peers. The gate is set here and nowhere else, so a Windows or
      # macOS job compiles `neotales-ssh-e2e` and skips at runtime rather than
      # requiring Docker that those runners may not have. Ubuntu runners ship a
      # Docker daemon, so the container peer is required there. `openssh-server`
      # is installed because `native_openssh` must run a present `sshd`; it
      # skips only when the binary is genuinely absent.
      - name: Real-peer end-to-end tests
        if: runner.os == 'Linux'
        env:
          NEOTALES_SSH_E2E: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server
          cargo test --workspace -p neotales-ssh-e2e --all-features

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs 1.100.0, the channel in rust-toolchain.toml and the minimum
      # supported version declared in Cargo.toml. Do not float to stable here:
      # a job named msrv that tests stable proves nothing.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: msrv

      # Every workspace member must declare the same minimum, not just the
      # first package cargo happens to list.
      - name: Check the declared minimum Rust version
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          import sys

          with open("metadata.json", encoding="utf-8") as handle:
              packages = json.load(handle)["packages"]

          if not packages:
              sys.exit("cargo metadata listed no packages")

          failed = False
          for package in packages:
              declared = package.get("rust_version") or ""
              print(f"{package['name']}: rust-version {declared or '<unset>'}")
              if declared != "1.100":
                  print(
                      f"::error::{package['name']} must declare "
                      f'rust-version = "1.100", found {declared or "<unset>"}.'
                  )
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      # The whole workspace, so the unpublished `e2e` member is compiled on the
      # minimum version too. Its runtime gate is unset here, so the real peers
      # skip; compiling them is the point.
      - name: Test on the minimum supported Rust version
        run: cargo test --workspace --all-targets --all-features

      - name: Doc tests on the minimum supported Rust version
        run: cargo test --workspace --doc --all-features
